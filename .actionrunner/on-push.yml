version: "2"
name: "MuRegist Distributed Pipeline: Formatting, Clippy & Verification"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: test-muregist
    name: "Validate MuRegist Suite & Tests"
    tags: ["build", "test"]
    depends_on: ["fmt-check", "clippy-check"]
    threads: 4
    run: "cargo test --lib --bins --tests"
